<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>

<script>
'use strict';

const h = React.createElement;
const { useState, useEffect, useCallback, useRef, useMemo, memo } = React;
const { ReactFlow, Background, Controls, Panel, Handle, Position, useNodesState, useEdgesState, getSmoothStepPath, getBezierPath, EdgeLabelRenderer } = window.ReactFlow;

const fmtKw  = w  => w  != null ? `${(w / 1000).toFixed(2)} kW` : '—';
const socColor = s => s > 60 ? '#16a34a' : s > 30 ? '#ca8a04' : '#dc2626';

function mkHandle(type, pos, id, style) {
  return h(Handle, { type, position: pos, id, style: { background: '#94a3b8', width: 8, height: 8, ...style } });
}

{% include "viz_nodes_basic.js" %}
{% include "viz_nodes_venus.js" %}
{% include "viz_nodes_devices.js" %}
{% include "viz_nodes_ats.js" %}
{% include "viz_detail.js" %}
{% include "viz_edges.js" %}
{% include "viz_nodes_charts.js" %}

const nodeTypes = {
  summary: SummaryNode, bms: BmsNode, et112card: Et112CardNode, device: DeviceNode,
  hub: HubNode, placeholder: PlaceholderNode, mpptGroup: MPPTGroupNode, smartshunt: SmartShuntNode,
  temperature: TemperatureNode,
  tongouGroup: TongouGroupNode,
  waterheater: WaterHeaterNode,
  inverter: InverterNode, inverterRs: InverterRsNode,
  atsreseau: AtsReseauNode, atsonduleur: AtsOnduleurNode, atsmain: AtsMainNode,
  sankey: SankeyNode,
  lynx: LynxNode, bus: BusNode, box: BoxNode, shelly: ShellyNode
};
const edgeTypes = { doubleLine: AnimatedFlowEdge, customBezier: CustomBezierEdge, tripleAts: TripleAtsEdge };

// ── Disposition (schéma de l'utilisateur : AC en haut, DC en bas) ────────────
// Les colonnes sont calculées pour que les liaisons verticales soient droites :
// I-AC-1 centré sur le Multiplus, II-AC-2 et ET112-AC2 sur les poignées du haut de
// l'Inverter RS, ATS et ET112-AC1 entre I-AC-1 et II-AC-2, poignées du Lynx sous les
// onduleurs. Largeurs : visualization.css (.inv-card 280, .pro-node 180,
// .bms-card-in-viz 275, .tongou-group-card 330, .ss-card 280, .bms-nd 280).
// Hauteurs mesurées dans la page (px du canevas) : Multiplus = SmartShunt = BMS 158,
// ET112 121, Groupe II (6 prises) 531, Flux énergétique 486, MPPT (6 chargeurs) 424,
// ATS 189, I-AC-1 / II-AC-2 196.
const W_INV = 280, W_ATS = 270, W_ET = 275, W_TG = 330, W_SS = 280, W_BMS = 280;
const H_DC = 158, H_ET = 121, H_TG2 = 531, H_FLUX = 486, H_MPPT = 424, H_LYNX = 34;
const H_ATS = 189, H_I = 196;
const MP_X = 480, RS_X = 950;                          // Multiplus, Inverter RS
const ATS_Y = 390;                                     // ATS
const I_Y   = ATS_Y + H_ATS + 50;                      // I-AC-1 / II-AC-2
const INV_Y = I_Y + H_I + 50;                          // Multiplus / Inverter RS
const RS_ATS_PCT = 25, RS_ET_PCT = 85;                 // poignées du haut de l'Inverter RS
const MP_C   = MP_X + W_INV / 2;                       // centre du Multiplus
const RS_C   = RS_X + W_INV / 2;                       // centre de l'Inverter RS
const I_C    = MP_C;                                   // centre de I-AC-1
const II_C   = RS_X + W_INV * RS_ATS_PCT / 100;        // centre de II-AC-2
const ATS_C  = (I_C + II_C) / 2;                       // centre de l'ATS et d'ET112-AC1
const ET2_C  = RS_X + W_INV * RS_ET_PCT / 100;         // centre d'ET112-AC2
const ET1_X  = ATS_C - W_ET / 2, ET2_X = ET2_C - W_ET / 2;
const TG1_X  = ET1_X - 80 - W_TG;                      // Tasmota AC1 à gauche d'ET112-AC1
const TG2_X  = ET2_X + W_ET + 80;                      // Tasmota AC2 à droite d'ET112-AC2
const MICRO_X = TG2_X + W_TG + 80;                     // ET112-Micro à droite de Tasmota AC2
const COL_A  = -120;                                   // Chauffe-eau, Grid, BMS
// Flux énergétique sous le Groupe II (bord gauche aligné), MPPT dessous ; le Lynx est
// centré sur la poignée gauche du MPPT (10 % de sa hauteur).
const FLUX_Y = H_TG2 + 40, MPPT_Y = FLUX_Y + H_FLUX + 40;
const LYNX_X = 440, LYNX_W = 840, LYNX_Y = MPPT_Y + H_MPPT * 0.10 - H_LYNX / 2;
const LYNX_C = LYNX_X + LYNX_W / 2;
const pctX   = x => ((x - LYNX_X) / LYNX_W) * 100;
// SmartShunt sous le Lynx, BMS du milieu à sa hauteur (même gabarit) : liaisons horizontales.
const SHUNT_Y = LYNX_Y + H_LYNX + 70;
const BMS_Y = [SHUNT_Y - H_DC - 20, SHUNT_Y, SHUNT_Y + H_DC + 20];
const BUS_Y = BMS_Y[0] + H_DC / 2, BUS_H = BMS_Y[2] - BMS_Y[0];
// ET112-Micro en haut à droite : poignée d'arrivée du Groupe II à la hauteur de sa sortie.
const MICRO_Y = 0, TG2_TR_PCT = ((MICRO_Y + H_ET / 2) / H_TG2) * 100;

// Canaux du Shelly Pro 2PM des DEYE, avec les noms qu'ils portent dans Venus
// (acload instance 51 = canal 1 = DEYE-1, instance 50 = canal 0 = DEYE-2).
const SHELLY_DEYE_CHANNELS = [{ ch: 1, name: 'DEYE-1' }, { ch: 0, name: 'DEYE-2' }];

const NODES0 = [
  // ── AC ──
  { id: 'chauffe-eau',   type: 'waterheater', position: { x: COL_A, y: 200 }, data: { label: 'Chauffe-eau',   icon: '🚿', live: null, heatpump: null, isClimatisation: false } },
  { id: 'tongou-group',  type: 'tongouGroup', position: { x: TG1_X, y: 0 },   data: { title: 'Groupe I · AC-1 (sortie ATS)', switches: [], disabled: false, _rev: 0 } },
  { id: 'et112-maison',  type: 'et112card',   position: { x: ET1_X, y: 204 }, data: { label: 'ET112-AC1', address: 8, live: null } },
  { id: 'ats-main',      type: 'atsmain',     position: { x: ATS_C - W_ATS / 2, y: ATS_Y }, data: { swRemote:'—', swMode:'—', swFault:'—', middleOFF:'—', sw1:'—', sw2:'—', active_source:'—', onToggleRemote: null, onForceOff: null, disabled: false, _rev: 0 } },
  { id: 'ats-onduleur',  type: 'atsonduleur', position: { x: I_C - W_ATS / 2,   y: I_Y }, data: { v1a:'—', sw1:'Ouvert', s1a:'—', cnt1:'0', max1:'—', t1:'—', onForce: null, disabled: false, _rev: 0 } },
  { id: 'ats-reseau',    type: 'atsreseau',   position: { x: II_C - W_ATS / 2,  y: I_Y }, data: { v2a:'—', sw2:'Ouvert', s2a:'—', cnt2:'0', max2:'—', t2:'—', onForce: null, disabled: false, _rev: 0 } },
  { id: 'et112-reseau',  type: 'et112card',   position: { x: ET2_X, y: 204 }, data: { label: 'ET112-AC2', address: 9, live: null } },
  { id: 'tongou-ac2',    type: 'tongouGroup', position: { x: TG2_X, y: 0 },   data: { title: 'Groupe II · AC-2', trPct: TG2_TR_PCT, switches: [], disabled: false, _rev: 0 } },
  // ET112-Micro et Shelly en haut à droite ; Climatisation dessous, à leur ancienne place.
  { id: 'micro-ond',     type: 'et112card',   position: { x: MICRO_X, y: MICRO_Y }, data: { label: 'ET112-Micro', address: 7, live: null } },
  { id: 'shelly',        type: 'shelly',      position: { x: MICRO_X + W_ET + 70, y: MICRO_Y }, data: { title: 'Shelly Pro 2PM', channels: SHELLY_DEYE_CHANNELS, live: null } },
  { id: 'climatisation', type: 'waterheater', position: { x: MICRO_X, y: 301 }, data: { label: 'Climatisation', icon: '❄️',  live: null, heatpump: null, isClimatisation: true  } },
  { id: 'sankey',        type: 'sankey',      position: { x: TG2_X, y: FLUX_Y }, data: { microPwr: 0, mpptPwr: 0, batPwr: 0, loadPwr: 0 } },
  { id: 'grid',          type: 'box',         position: { x: COL_A, y: INV_Y }, data: { title: 'Grid', badge: 'Off-grid', variant: 'grid' } },
  // ── Onduleurs ──
  { id: 'onduleur',      type: 'inverter',    position: { x: MP_X, y: INV_Y }, data: { live: null } },
  { id: 'inverter-rs',   type: 'inverterRs',  position: { x: RS_X, y: INV_Y }, data: { atsPct: RS_ATS_PCT, etPct: RS_ET_PCT } },
  { id: 'cerbo',         type: 'box',         position: { x: (MP_X + W_INV + RS_X) / 2 - 75, y: INV_Y + 80 }, data: { title: 'Cerbo GX', variant: 'cerbo' } },
  // ── DC ──
  { id: 'lynx',          type: 'lynx',        position: { x: LYNX_X, y: LYNX_Y }, data: { width: LYNX_W, mpPct: pctX(MP_C), rsPct: pctX(RS_C), shuntPct: 50 } },
  { id: 'mppt',          type: 'mpptGroup',   position: { x: TG2_X, y: MPPT_Y }, data: { mppts: [], totalPowerW: 0, totalDcA: 0 } },
  { id: 'smartshunt',    type: 'smartshunt',  position: { x: LYNX_C - W_SS / 2, y: SHUNT_Y }, data: { live: null } },
  { id: 'bms-bus',       type: 'bus',         position: { x: COL_A + W_BMS + 60, y: BUS_Y }, data: { height: BUS_H, inPcts: [0, 50, 100], outPct: 50 } },
  { id: 'bms1',          type: 'bms',         position: { x: COL_A, y: BMS_Y[0] }, data: { label: 'BMS-360Ah', live: null } },
  { id: 'bms2',          type: 'bms',         position: { x: COL_A, y: BMS_Y[1] }, data: { label: 'BMS-320Ah', live: null } },
  { id: 'bms3',          type: 'bms',         position: { x: COL_A, y: BMS_Y[2] }, data: { label: 'BMS-620Ah', live: null } },
];

const COLOR = { ac: '#2563eb', dc: '#ea580c', bat: '#16a34a', gray: '#94a3b8' };

function mkEdge(id, src, tgt, color, opts = {}) {
  const { history, ...rest } = opts;
  const data = history ? { history } : undefined;
  return {
    id, source: src, target: tgt,
    type: 'doubleLine', animated: false,
    style: { stroke: color, strokeWidth: 2.5 },
    ...(data ? { data } : {}),
    ...rest,
  };
}

// Historique de chaque liaison (bouton 📈 → fiche détail) : mesure du metrics-store, unité,
// et pour une mesure signée, le sens de chaque signe.
const BAT_SIGN = { pos: 'charge', neg: 'décharge' };
const HIST_ET112_7 = { metric: 'et112_power_w', address: '0x07', unit: 'W', label: 'Puissance ET112-Micro' };
const HIST_ET112_8 = { metric: 'et112_power_w', address: '0x08', unit: 'W', label: 'Puissance ET112-AC1' };
const HIST_ET112_9 = { metric: 'et112_power_w', address: '0x09', unit: 'W', label: 'Puissance ET112-AC2' };

// Tongou (topic MQTT) affichés à part : chauffe-eau, climatisation, et coupure des DEYE
// (ce dernier mesure la production des DEYE : exclu de la somme des charges).
const WH_TASMOTA   = 'tongou_B459B8';
const CLIM_TASMOTA = 'tongou_3BC764';
const DEYE_TASMOTA = 'tongou_0616E4';
const tasmotaLive = d => d ? {
  connected: d.connected,
  power_w: d.power_w,
  energy_import_wh: d.energy_total_kwh != null ? d.energy_total_kwh * 1000 : null,
} : null;
const HIST_BMS_1  = { metric: 'bms_current', bms_id: '0x01', unit: 'A', sign: BAT_SIGN, label: 'Courant BMS-360Ah' };
const HIST_BMS_2  = { metric: 'bms_current', bms_id: '0x02', unit: 'A', sign: BAT_SIGN, label: 'Courant BMS-320Ah' };
const HIST_BMS_3  = { metric: 'bms_current', bms_id: '0x03', unit: 'A', sign: BAT_SIGN, label: 'Courant BMS-620Ah' };
const HIST_MPPT   = { metric: 'solar_total_w',                    unit: 'W', label: 'Production solaire totale' };
const HIST_INV_DC = { metric: 'venus_inverter_power_w',           unit: 'W', sign: BAT_SIGN, label: 'Puissance DC Multiplus' };
const HIST_INV_AC = { metric: 'venus_inverter_ac_output_power_w', unit: 'W', label: 'Puissance AC en sortie du Multiplus' };
const HIST_SHUNT  = { metric: 'venus_shunt_current_a',            unit: 'A', sign: BAT_SIGN, label: 'Courant batterie (SmartShunt)' };

// Liaisons du schéma. Les arêtes ATS ↔ I-AC-1 / II-AC-2 (ats-e1 / ats-e2) sont ajoutées
// dans applyData selon la source sélectionnée.
const EDGES0 = [
  // AC-1 : ATS → ET112-AC1 → Tasmota AC1 ; Multiplus → I-AC-1
  mkEdge('e-ats-maison',     'ats-main',     'et112-maison', COLOR.ac,  { sourceHandle: 'main-top', targetHandle: 'tb', history: HIST_ET112_8 }),
  mkEdge('e-maison-switchs', 'et112-maison', 'tongou-group', COLOR.ac,  { sourceHandle: 'sl', targetHandle: 'tr', type: 'customBezier', history: HIST_ET112_8 }),
  mkEdge('e-onduleur-ats',   'ats-onduleur', 'onduleur',     COLOR.ac,  { sourceHandle: 'onduleur-bottom', targetHandle: 'tt', history: HIST_INV_AC }),
  // AC-2 : Inverter RS → II-AC-2 et → ET112-AC2 → Tasmota AC2 ; ET112-Micro (DEYE) → Tasmota AC2
  mkEdge('e-rs-ats2',        'inverter-rs',  'ats-reseau',   COLOR.ac,  { sourceHandle: 'st-ats', targetHandle: 'reseau-in' }),
  mkEdge('e-rs-ac2',         'et112-reseau', 'inverter-rs',  COLOR.ac,  { sourceHandle: 'sb', targetHandle: 'tt-et', history: HIST_ET112_9 }),
  mkEdge('e-ac2-switchs',    'et112-reseau', 'tongou-ac2',   COLOR.ac,  { sourceHandle: 'sr', targetHandle: 'tlm', type: 'customBezier', history: HIST_ET112_9 }),
  mkEdge('e-micro-ac2',      'micro-ond',    'tongou-ac2',   COLOR.ac,  { sourceHandle: 'sl', targetHandle: 'tr', type: 'customBezier', history: HIST_ET112_7 }),
  // DC : Multiplus, Inverter RS, MPPT ↔ Lynx Distributor ↔ SmartShunt ↔ barre BMS ↔ BMS
  mkEdge('e-ond-lynx',       'onduleur',     'lynx',         COLOR.dc,  { sourceHandle: 'sb', targetHandle: 'in-mp', history: HIST_INV_DC }),
  mkEdge('e-rs-lynx',        'inverter-rs',  'lynx',         COLOR.dc,  { sourceHandle: 'sb', targetHandle: 'in-rs' }),
  mkEdge('e-mppt-lynx',      'mppt',         'lynx',         COLOR.dc,  { sourceHandle: 'sl', targetHandle: 'in-mppt', type: 'customBezier', history: HIST_MPPT }),
  mkEdge('e-lynx-shunt',     'lynx',         'smartshunt',   COLOR.dc,  { sourceHandle: 'out-shunt', targetHandle: 'tt', history: HIST_SHUNT }),
  mkEdge('e-shu-bus',        'bms-bus',      'smartshunt',   COLOR.bat, { sourceHandle: 'out', targetHandle: 'tl', type: 'customBezier', history: HIST_SHUNT }),
  mkEdge('e-bus-b1',         'bms1',         'bms-bus',      COLOR.bat, { sourceHandle: 'sr', targetHandle: 'in-b1', type: 'customBezier', history: HIST_BMS_1 }),
  mkEdge('e-bus-b2',         'bms2',         'bms-bus',      COLOR.bat, { sourceHandle: 'sr', targetHandle: 'in-b2', type: 'customBezier', history: HIST_BMS_2 }),
  mkEdge('e-bus-b3',         'bms3',         'bms-bus',      COLOR.bat, { sourceHandle: 'sr', targetHandle: 'in-b3', type: 'customBezier', history: HIST_BMS_3 }),
];

// ── Fiche détail (viz_detail.js) : contenu de la fiche de chaque box et de chaque liaison ──
// Chaque graphique = une mesure (une unité, un seul axe) ; series[].q = requête PromQL sur le
// metrics-store (étiquettes vérifiées : bms_id 0x01-0x03, address 0x07-0x09, id des Tongou
// et du Shelly, instance des MPPT, mqtt_index des pompes à chaleur). L'unité fixe les
// décimales et l'énergie de la période (W → kWh, A → Ah) ; sign nomme les deux sens.
// Sans entrée ici, une box n'ouvre pas de fiche (Grid, Cerbo GX, Inverter RS à venir).
const NODE_NAMES = {
  'chauffe-eau': 'Chauffe-eau', 'tongou-group': 'Groupe I · AC-1', 'et112-maison': 'ET112-AC1',
  'ats-main': 'ATS', 'ats-onduleur': 'I · AC-1 MultiPlus', 'ats-reseau': 'II · AC-2 Inverter RS',
  'et112-reseau': 'ET112-AC2', 'tongou-ac2': 'Groupe II · AC-2', 'micro-ond': 'ET112-Micro',
  shelly: 'Shelly Pro 2PM · DEYE', climatisation: 'Climatisation', sankey: 'Flux énergétique',
  onduleur: 'Multiplus', 'inverter-rs': 'Inverter RS', lynx: 'Lynx Distributor', mppt: 'MPPT',
  smartshunt: 'SmartShunt', 'bms-bus': 'Batteries', bms1: 'BMS-360Ah', bms2: 'BMS-320Ah', bms3: 'BMS-620Ah',
};
const serie = (q, name) => ({ q, name });
const bmsCharts = id => [
  { title: 'Courant', unit: 'A', sign: BAT_SIGN, series: [serie(`bms_current{bms_id="${id}"}`, 'Courant')] },
  { title: 'Tension', unit: 'V', series: [serie(`bms_voltage{bms_id="${id}"}`, 'Tension')] },
  { title: 'SOC', unit: '%', series: [serie(`bms_soc{bms_id="${id}"}`, 'SOC')] },
  { title: 'Température max', unit: '°C', series: [serie(`bms_temp_max{bms_id="${id}"}`, 'Température max')] },
];
const et112Charts = addr => [
  { title: 'Puissance', unit: 'W', series: [serie(`et112_power_w{address="${addr}"}`, 'Puissance')] },
  { title: 'Courant', unit: 'A', series: [serie(`et112_current_a{address="${addr}"}`, 'Courant')] },
  { title: 'Tension', unit: 'V', series: [serie(`et112_voltage_v{address="${addr}"}`, 'Tension')] },
];
const tongouPower = (tasmota, topic, name) => {
  const t = tasmota.find(x => x.tasmota_id === topic);
  return t ? { title: 'Puissance', unit: 'W', series: [serie(`tasmota_power_w{id="${t.id}"}`, name)] } : null;
};
const groupCharts = n => {
  const sw = n.data.switches || [];
  return sw.length ? [{ title: 'Puissance par prise', unit: 'W',
    series: sw.map(s => serie(`tasmota_power_w{id="${s.id}"}`, s.name)) }] : [];
};
const NODE_DETAIL = {
  bms1: { color: COLOR.bat, charts: () => bmsCharts('0x01') },
  bms2: { color: COLOR.bat, charts: () => bmsCharts('0x02') },
  bms3: { color: COLOR.bat, charts: () => bmsCharts('0x03') },
  'bms-bus': { color: COLOR.bat, box: false, charts: () => [
    { title: 'Courant des batteries', unit: 'A', sign: BAT_SIGN, series: [
      serie('bms_current{bms_id="0x01"}', 'BMS-360Ah'), serie('bms_current{bms_id="0x02"}', 'BMS-320Ah'),
      serie('bms_current{bms_id="0x03"}', 'BMS-620Ah')] }] },
  smartshunt: { color: COLOR.dc, charts: () => [
    { title: 'Courant', unit: 'A', sign: BAT_SIGN, series: [serie('venus_shunt_current_a', 'Courant')] },
    { title: 'Puissance', unit: 'W', sign: BAT_SIGN, series: [serie('venus_shunt_power_w', 'Puissance')] },
    { title: 'Tension', unit: 'V', series: [serie('venus_shunt_voltage_v', 'Tension')] },
    { title: 'SOC', unit: '%', series: [serie('venus_shunt_soc_percent', 'SOC')] }] },
  lynx: { color: COLOR.dc, box: false, charts: () => [
    { title: 'Puissances sur le bus DC', unit: 'W', series: [
      serie('solar_total_w', 'MPPT'), serie('venus_inverter_power_w', 'Multiplus'),
      serie('venus_shunt_power_w', 'Batteries (SmartShunt)')] }] },
  mppt: { color: COLOR.dc, charts: n => [
    { title: 'Production totale', unit: 'W', series: [serie('solar_total_w', 'Production totale')] },
    { title: 'Production par chargeur', unit: 'W', series: (n.data.mppts || []).map(m =>
      serie(`venus_mppt_power_w{instance="${m.instance}"}`, m.name || ('MPPT-' + m.instance))) },
    { title: 'Ensoleillement', unit: 'W/m²', series: [serie('irradiance_wm2', 'Ensoleillement')] },
  ].filter(c => c.series.length) },
  onduleur: { color: COLOR.dc, charts: () => [
    { title: 'Puissance DC', unit: 'W', sign: BAT_SIGN, series: [serie('venus_inverter_power_w', 'Puissance DC')] },
    { title: 'Puissance AC en sortie', unit: 'W', series: [serie('venus_inverter_ac_output_power_w', 'Puissance AC')] },
    { title: 'Tension DC', unit: 'V', series: [serie('venus_inverter_voltage_v', 'Tension DC')] }] },
  sankey: { color: COLOR.dc, charts: () => [
    { title: 'Production', unit: 'W', series: [
      serie('solar_total_w', 'Solaire (MPPT)'), serie('et112_power_w{address="0x07"}', 'Micro-onduleurs (ET112-Micro)')] },
    { title: 'Batteries (SmartShunt)', unit: 'W', sign: BAT_SIGN, series: [serie('venus_shunt_power_w', 'Batteries')] }] },
  'et112-maison': { color: COLOR.ac, charts: () => et112Charts('0x08') },
  'et112-reseau': { color: COLOR.ac, charts: () => et112Charts('0x09') },
  'micro-ond':    { color: COLOR.ac, charts: () => et112Charts('0x07') },
  'tongou-group': { color: COLOR.ac, charts: groupCharts },
  'tongou-ac2':   { color: COLOR.ac, charts: groupCharts },
  'chauffe-eau':  { color: COLOR.ac, charts: (n, ctx) => [
    tongouPower(ctx.tasmota, WH_TASMOTA, 'Chauffe-eau'),
    { title: 'Température de l\'eau', unit: '°C', series: [serie('venus_heatpump_temp_c{mqtt_index="1"}', 'Température')] },
  ].filter(Boolean) },
  climatisation: { color: COLOR.ac, charts: (n, ctx) => [tongouPower(ctx.tasmota, CLIM_TASMOTA, 'Climatisation')].filter(Boolean) },
  shelly: { color: COLOR.ac, charts: (n, ctx) => ctx.shellyId == null ? [] : [
    { title: 'Puissance par canal', unit: 'W', series: SHELLY_DEYE_CHANNELS.map(c =>
      serie(`shelly_channel_power_w{id="${ctx.shellyId}",channel="${c.ch}"}`, c.name)) }] },
  'ats-main': { color: COLOR.ac, charts: () => [
    { title: 'Tension des sources', unit: 'V', series: [serie('ats_v1a', 'Source I · AC-1'), serie('ats_v2a', 'Source II · AC-2')] }] },
  'ats-onduleur': { color: COLOR.ac, charts: () => [{ title: 'Tension', unit: 'V', series: [serie('ats_v1a', 'Tension')] }] },
  'ats-reseau':   { color: COLOR.ac, charts: () => [{ title: 'Tension', unit: 'V', series: [serie('ats_v2a', 'Tension')] }] },
};
NODES0.forEach(n => { if (NODE_DETAIL[n.id]) n.className = 'vd-clickable'; });

// Fiche ouverte : { kind: 'node' | 'edge', id } → titre, box (ou null) et graphiques.
function buildDetail(detail, nodes, edges, ctx) {
  if (detail.kind === 'edge') {
    const e = edges.find(x => x.id === detail.id), hs = e?.data?.history;
    if (!hs) return null;
    const q = hs.bms_id ? `${hs.metric}{bms_id="${hs.bms_id}"}`
      : hs.address ? `${hs.metric}{address="${hs.address}"}` : hs.metric;
    return { title: `${NODE_NAMES[e.source] || e.source} ↔ ${NODE_NAMES[e.target] || e.target}`,
      color: e.style?.stroke, node: null,
      charts: [{ title: hs.label, unit: hs.unit, sign: hs.sign, series: [serie(q, hs.label)] }] };
  }
  const n = nodes.find(x => x.id === detail.id), d = NODE_DETAIL[detail.id];
  if (!n || !d) return null;
  return { title: NODE_NAMES[n.id] || n.id, color: d.color, node: d.box === false ? null : n, charts: d.charts(n, ctx) };
}


function ESSFlow() {
  const [nodes, setNodes, onNodesChange] = useNodesState(NODES0);
  const [edges, setEdges, onEdgesChange] = useEdgesState(EDGES0);
  const [lastUpdate, setLastUpdate] = useState('—');
  const [dataAge, setDataAge]       = useState(0);
  const lastUpdateTsRef = useRef(null);
  const [atsProcessing, setAtsProcessing] = useState(false);
  const [atsRev, setAtsRev] = useState(0);
const atsExecRef = useRef(null);
  const atsBusyRef = useRef(false);

  // Fiche détail : box ou liaison ouverte, période des historiques (gardée d'une fiche à
  // l'autre), dernières listes utiles aux requêtes (Tongou, Shelly).
  const [detail, setDetail] = useState(null);
  const [detailMinutes, setDetailMinutes] = useState(360);
  const detailCtxRef = useRef({ tasmota: [], shellyId: null });
  const openDetail = useCallback((kind, id) => setDetail({ kind, id }), []);
  const closeDetail = useCallback(() => setDetail(null), []);
  // Un clic sur un bouton d'une box (ATS, prises) garde son action et n'ouvre pas la fiche.
  const onNodeClick = useCallback((e, node) => {
    if (e.target.closest && e.target.closest('button, [data-is-interactive]')) return;
    if (NODE_DETAIL[node.id]) setDetail({ kind: 'node', id: node.id });
  }, []);
  const onEdgeClick = useCallback((e, edge) => {
    if (edge.data?.history) setDetail({ kind: 'edge', id: edge.id });
  }, []);

  atsExecRef.current = async function(steps) {
    if (atsBusyRef.current) return;
    atsBusyRef.current = true;
    setAtsProcessing(true);
    try {
      for (const step of steps) {
        if (typeof step === 'string') await fetch('/api/v1/ats/' + step, { method: 'POST', cache: 'no-cache' });
        else if (typeof step === 'number') await new Promise(r => setTimeout(r, step));
      }
    } finally {
      atsBusyRef.current = false;
      setAtsProcessing(false);
    }
  };

  const handleAtsReseauForce = useCallback(() => {
    console.log('[CALLBACK] Force source II (AC-2 Inverter RS) appelé');
    atsExecRef.current?.(['remote_on', 200, 'force_source2', 200, 'remote_off']);
  }, []);

  const handleAtsOnduleurForce = useCallback(() => {
    console.log('[CALLBACK] Force source I (AC-1 MultiPlus) appelé');
    atsExecRef.current?.(['remote_on', 200, 'force_source1', 200, 'remote_off']);
  }, []);

  const handleAtsToggleRemote = useCallback(() => {
    console.log('[CALLBACK] Toggle Remote appelé');
    atsExecRef.current?.(['remote_on', 300]);
  }, []);

  const handleAtsForceOff = useCallback(() => {
    console.log('[CALLBACK] Force Off appelé');
    if (window.confirm('⚠️ Confirmer Double OFF ?')) {
      atsExecRef.current?.(['remote_on', 200, 'force_double', 200, 'remote_off']);
    }
  }, []);

  const applyData = useCallback(function(d) {
    const bms1 = d.bms1, bms2 = d.bms2, bms3 = d.bms3;
    const et7  = d.et7,  et8  = d.et8, et9 = d.et9;
    const mpptList        = d.mpptList        ?? [];
    const mpptTotalPowerW = d.mpptTotalPowerW  ?? 0;
    const mpptTotalDcA    = d.mpptTotalDcA     ?? 0;
    const shunt = d.shunt;
    const inverter = d.inverter;
    const ats = d.ats;
    const tasmotaDevices = d.tasmotaDevices || [];
    const tasmotaAc1 = tasmotaDevices.filter(t => t.network !== 'AC-2');
    const tasmotaAc2 = tasmotaDevices.filter(t => t.network === 'AC-2');
    const sumOn = list => list.reduce((s, t) => s + (t.connected ? (t.power_w ?? 0) : 0), 0);
    const heatpumps = d.heatpumps || [];
    const hp1 = heatpumps.find(h => h.mqtt_index === 1) ?? null;
    const hp9 = heatpumps.find(h => h.mqtt_index === 9) ?? null;

    detailCtxRef.current = { tasmota: tasmotaDevices, shellyId: d.shellyId ?? null };

    const validBms = [bms1, bms2, bms3].filter(Boolean);
    const totalPwr = validBms.reduce((s, b) => s + (b.Dc?.Power ?? 0), 0);

    setEdges(function (prev) {
      const withFlow = prev.map(function (e) {
        if (e.type !== 'doubleLine' && e.type !== 'customBezier') return e;
        let fv = 0, rev = false, speedDiv = 500;
        switch (e.id) {
          case 'e-ats-maison':
          case 'e-maison-switchs':  fv = Math.abs(et8?.power_w              ?? 0); break;
          case 'e-micro-ac2':       fv = Math.abs(et7?.power_w              ?? 0); break;
          // Courant AC sortie onduleur (A) — diviseur adapté aux ampères
          case 'e-onduleur-ats':    fv = Math.abs(inverter?.ac_output_current_a ?? 0); rev = true; speedDiv = 5; break;
          // Inverter RS pas encore installé : ET112-AC2 en attendant (à brancher à son installation).
          case 'e-rs-ats2':         fv = Math.abs(et9?.power_w              ?? 0); break;
          case 'e-rs-ac2':          fv = Math.abs(et9?.power_w              ?? 0); rev = true; break;
          case 'e-ac2-switchs':     fv = sumOn(tasmotaAc2.filter(t => t.tasmota_id !== DEYE_TASMOTA)); break;
          case 'e-mppt-lynx':       fv = mpptTotalPowerW;                          break;
          case 'e-rs-lynx':         fv = 0;                                        break;
          // Multiplus : P DC < 0 en onduleur (Lynx → Multiplus), > 0 en charge.
          case 'e-ond-lynx': {
            const pw = inverter?.power_w ?? 0; fv = Math.abs(pw); rev = pw < 0; break;
          }
          // SmartShunt : P > 0 = charge (Lynx → batteries), < 0 = décharge.
          case 'e-lynx-shunt': {
            const pw = shunt?.power_w ?? 0; fv = Math.abs(pw); rev = pw < 0; break;
          }
          case 'e-shu-bus': {
            const pw = shunt?.power_w ?? 0; fv = Math.abs(pw); rev = pw > 0; break;
          }
          case 'e-bus-b1': {
            const pw = bms1?.Dc?.Power ?? 0; fv = Math.abs(pw); rev = pw > 0; break;
          }
          case 'e-bus-b2': {
            const pw = bms2?.Dc?.Power ?? 0; fv = Math.abs(pw); rev = pw > 0; break;
          }
          case 'e-bus-b3': {
            const pw = bms3?.Dc?.Power ?? 0; fv = Math.abs(pw); rev = pw > 0; break;
          }
        }
        return {
          ...e,
          data: {
            ...(e.data || {}),
            flowValue:     fv,
            reverse:       rev,
            flowSpeed:     Math.min(4, Math.max(0.4, fv / speedDiv)),
            flowColor:     e.style?.stroke ?? '#2563eb',
            particleCount: 2,
          },
        };
      });

      if (!ats) return withFlow;

      const sw1C   = (ats.sw1 || '').includes('Fermé');
      const sw2C   = (ats.sw2 || '').includes('Fermé');
      const midOff = (ats.middleOFF || '').includes('Activé');
      const atsEdges = [];
      if (!midOff) {
        if (sw2C) {
          const e2pwr = Math.abs(et9?.power_w ?? 0);
          atsEdges.push({
            id: 'ats-e2', source: 'ats-reseau', target: 'ats-main',
            sourceHandle: 'reseau-out', targetHandle: 'ats-in-reseau',
            type: 'tripleAts',
            style: { stroke: sw1C ? '#6366f1' : '#10b981', strokeWidth: 2 },
            data: {
              useBezier: false,
              flowValue: e2pwr,
              flowSpeed: Math.min(4, Math.max(0.4, e2pwr / 500)),
              flowColor: sw1C ? '#6366f1' : '#10b981',
            }
          });
        }
        if (sw1C) {
          // Courant AC sortie onduleur (A) vers ATS-main — diviseur adapté aux ampères
          const e1a = Math.abs(inverter?.ac_output_current_a ?? 0);
          atsEdges.push({
            id: 'ats-e1', source: 'ats-onduleur', target: 'ats-main',
            sourceHandle: 'onduleur-out', targetHandle: 'ats-in-onduleur',
            type: 'tripleAts',
            style: { stroke: '#10b981', strokeWidth: 2 },
            data: {
              useBezier: false,
              flowValue: e1a,
              flowSpeed: Math.min(4, Math.max(0.4, e1a / 5)),
              flowColor: '#10b981',
            }
          });
        }
      }
      return [...withFlow.filter(function (e) { return !e.id.startsWith('ats-e'); }), ...atsEdges];
    });

    const newRev = atsRev + 1;
    setAtsRev(newRev);

    setNodes(prev => prev.map(n => {
      switch (n.id) {
        case 'sankey': {
          const loadPwr        = sumOn(tasmotaDevices.filter(t => t.tasmota_id !== DEYE_TASMOTA));
          const batChargePwr   = Math.max(0, totalPwr);
          const batDischargePwr = Math.max(0, -totalPwr);
          return { ...n, data: { ...n.data, microPwr: et7?.power_w ?? 0, mpptPwr: mpptTotalPowerW, batChargePwr, batDischargePwr, loadPwr } };
        }
        case 'bms1': return { ...n, data: { ...n.data, live: bms1 ?? null } };
        case 'bms2': return { ...n, data: { ...n.data, live: bms2 ?? null } };
        case 'bms3': return { ...n, data: { ...n.data, live: bms3 ?? null } };
        case 'micro-ond':   return { ...n, data: { ...n.data, live: et7  ?? null } };
        case 'et112-reseau': return { ...n, data: { ...n.data, live: et9 ?? null } };
        case 'et112-maison': return { ...n, data: { ...n.data, live: et8 ?? null } };
        case 'onduleur':    return { ...n, data: { ...n.data, live: inverter ?? null } };
        case 'chauffe-eau':   return { ...n, data: { ...n.data, live: tasmotaLive(tasmotaDevices.find(t => t.tasmota_id === WH_TASMOTA)),   heatpump: hp1 } };
        case 'climatisation': return { ...n, data: { ...n.data, live: tasmotaLive(tasmotaDevices.find(t => t.tasmota_id === CLIM_TASMOTA)), heatpump: hp9 } };
        case 'mppt':        return { ...n, data: { ...n.data, mppts: mpptList, totalPowerW: mpptTotalPowerW, totalDcA: mpptTotalDcA } };
        case 'smartshunt':  return { ...n, data: { ...n.data, live: shunt ?? null } };
        case 'shelly':      return { ...n, data: { ...n.data, live: d.shelly ?? null } };
        case 'tongou-group': return { ...n, data: { ...n.data, switches: tasmotaAc1, disabled: atsProcessing, _rev: newRev } };
        case 'tongou-ac2':   return { ...n, data: { ...n.data, switches: tasmotaAc2, disabled: atsProcessing, _rev: newRev } };

        case 'ats-reseau':
          if (!ats) return n;
          return {
            ...n,
            data: {
              ...ats,
              disabled: atsProcessing,
              onForce: handleAtsReseauForce,
              _rev: newRev
            }
          };
        case 'ats-onduleur':
          if (!ats) return n;
          return {
            ...n,
            data: {
              ...ats,
              disabled: atsProcessing,
              onForce: handleAtsOnduleurForce,
              _rev: newRev
            }
          };
        case 'ats-main':
          if (!ats) return n;
          return {
            ...n,
            data: {
              ...ats,
              disabled: atsProcessing,
              onToggleRemote: handleAtsToggleRemote,
              onForceOff: handleAtsForceOff,
              _rev: newRev
            }
          };
        default: return n;
      }
    }));

    setLastUpdate(new Date().toLocaleTimeString('fr-FR'));
    lastUpdateTsRef.current = Date.now();
    setDataAge(0);
  }, [atsProcessing, atsRev, handleAtsReseauForce, handleAtsOnduleurForce, handleAtsToggleRemote, handleAtsForceOff]);

  useEffect(function() {
    const safe = p => p.catch(() => null);
    async function fetchAll() {
      const [bms1, bms2, bms3, et7, et8, et9, venusResp, atsResp] = await Promise.all([
        safe(fetch('/api/v1/bms/1/status').then(r => r.ok ? r.json() : null)),
        safe(fetch('/api/v1/bms/2/status').then(r => r.ok ? r.json() : null)),
        safe(fetch('/api/v1/bms/3/status').then(r => r.ok ? r.json() : null)),
        safe(fetch('/api/v1/et112/7/status').then(r => r.ok ? r.json() : null)),
        safe(fetch('/api/v1/et112/8/status').then(r => r.ok ? r.json() : null)),
        safe(fetch('/api/v1/et112/9/status').then(r => r.ok ? r.json() : null)),
        safe(fetch('/api/v1/venus/mppt').then(r => r.ok ? r.json() : null)),
        safe(fetch('/api/v1/ats/status').then(r => r.ok ? r.json() : null)),
      ]);

      // Toutes les prises configurées (Config.toml [[tasmota.devices]]) avec leur réseau et leur
      // dernier relevé ; snapshot null = jamais reçu (prise hors ligne / pas encore configurée).
      const tasmotaResp = await safe(fetch('/api/v1/tasmota').then(r => r.ok ? r.json() : null));
      const tasmotaDevices = (tasmotaResp?.tasmota ?? []).map(t => {
        const s = t.snapshot;
        return {
          id: t.id,
          name: t.name || `Switch ${t.id}`,
          tasmota_id: t.tasmota_id,
          network: t.network ?? null,
          connected: !!s,
          power_on: s?.power_on ?? false,
          power_w: s?.power_w ?? 0,
          voltage_v: s?.voltage_v ?? 0,
          current_a: s?.current_a ?? 0,
          energy_today_kwh: s?.energy_today_kwh ?? 0,
          energy_total_kwh: s?.energy_total_kwh ?? null,
        };
      });

      const mpptList        = venusResp?.mppts         ?? [];
      const mpptTotalPowerW = venusResp?.total_power_w  ?? 0;
      const mpptTotalDcA    = venusResp?.total_dc_current_a ?? 0;
      const [shuntResp, inverterResp, heatpumpsResp, shellyResp] = await Promise.all([
        safe(fetch('/api/v1/venus/smartshunt').then(r => r.ok ? r.json() : null)),
        safe(fetch('/api/v1/venus/inverter').then(r => r.ok ? r.json() : null)),
        safe(fetch('/api/v1/venus/heatpumps').then(r => r.ok ? r.json() : null)),
        safe(fetch('/api/v1/shelly').then(r => r.ok ? r.json() : null)),
      ]);
      const shunt = shuntResp?.shunt ?? null;
      const inverter = inverterResp?.inverter ?? null;
      const heatpumps = heatpumpsResp?.heatpumps ?? [];
      const ats = atsResp?.values ?? null;
      // Shelly Pro 2PM des DEYE (seul Shelly configuré) : dernier relevé, null si jamais reçu.
      const shelly = shellyResp?.shelly?.[0]?.snapshot ?? null;
      const shellyId = shellyResp?.shelly?.[0]?.id ?? null;

      applyData({ bms1, bms2, bms3, et7, et8, et9, mpptList, mpptTotalPowerW, mpptTotalDcA, shunt, inverter, ats, tasmotaDevices, heatpumps, shelly, shellyId });
    }
    fetchAll();
    const timer = setInterval(fetchAll, 2000);

    // Re-fetch immediately when tab becomes visible (browser throttles setInterval in background)
    function onVisibility() {
      if (!document.hidden) fetchAll();
    }
    document.addEventListener('visibilitychange', onVisibility);

    // Age counter — ticks every second to show data staleness
    const ageTick = setInterval(function() {
      if (lastUpdateTsRef.current) {
        setDataAge(Math.floor((Date.now() - lastUpdateTsRef.current) / 1000));
      }
    }, 1000);

    return function() {
      clearInterval(timer);
      clearInterval(ageTick);
      document.removeEventListener('visibilitychange', onVisibility);
    };
  }, [applyData]);

  const legend = [
    { color: COLOR.ac,  label: 'Courant AC' },
    { color: COLOR.dc,  label: 'Bus DC' },
    { color: COLOR.bat, label: 'Batterie' },
  ];

  const detailSpec = detail ? buildDetail(detail, nodes, edges, detailCtxRef.current) : null;

  return h(DetailCtx.Provider, { value: openDetail },
  h(ReactFlow, {
    nodes, edges, onNodesChange, onEdgesChange, nodeTypes, edgeTypes, fitView: true,
    fitViewOptions: { padding: 0.06 }, minZoom: 0.2, maxZoom: 2.5,
    nodesDraggable: false, nodesConnectable: false, elementsSelectable: false, preventScrolling: false,
    onNodeClick, onEdgeClick,
  },
    h(Background, { variant: 'dots', gap: 20, size: 1, color: '#c8d3de' }),
    h(Controls, { showInteractive: false }),
    h(Panel, { position: 'bottom-left' },
      h('div', { className: 'viz-panel viz-legend' },
        ...legend.map(l => h('div', { key: l.color, className: 'viz-leg-item' },
          h('div', { className: 'viz-leg-line', style: { background: l.color } }),
          l.label
        ))
      )
    ),
    h(Panel, { position: 'bottom-right' },
      h('div', { className: 'viz-panel', style: { display: 'flex', alignItems: 'center', gap: '6px' } },
        h('span', { style: {
          width: '8px', height: '8px', borderRadius: '50%', display: 'inline-block', flexShrink: 0,
          background: dataAge < 5 ? '#22c55e' : dataAge < 15 ? '#f59e0b' : '#ef4444'
        }}),
        dataAge < 5
          ? `Màj : ${lastUpdate}`
          : `Màj : ${lastUpdate} (${dataAge}s)`
      )
    ),
  ),
  detailSpec ? h(DetailSheet, { spec: detailSpec, minutes: detailMinutes, setMinutes: setDetailMinutes, onClose: closeDetail }) : null
  );
}

ReactDOM.createRoot(document.getElementById('ess-flow-root')).render(h(ESSFlow));
</script>
{% endblock %}
